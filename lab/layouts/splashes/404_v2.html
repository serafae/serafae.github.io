<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #7EE7F2;
      min-height: 100vh;
      font-family: sans-serif; /* replace with your own font */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Return button */
    .return {
      position: fixed;
      top: 28px;
      left: 28px;
      color: #7EE7F2;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 1px;
      opacity: 0.85;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .return:hover {
      opacity: 1;
      text-shadow: 0 0 12px #7EE7F2, 0 0 24px #7EE7F2;
    }

    /* Layout */
    .wrapper {
      width: 100%;
      max-width: 1100px;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 60px;
    }

    .text {
      max-width: 360px;
    }

    .text h1 {
      font-size: 1.7rem;
      font-weight: 500;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .text p {
      font-size: 1rem;
      opacity: 0.65;
      line-height: 1.5;
    }

    /* Big 404 on the right */
    .code {
      font-size: clamp(8rem, 20vw, 15rem);
      font-weight: 700;
      line-height: 1;
      position: relative;
      color: #7EE7F2;
      flex-shrink: 0;
    }

    /* Cleaner glitch */
    .glitch {
      position: relative;
      display: inline-block;
    }

    .glitch::before,
    .glitch::after {
      content: "404";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .glitch::before {
      left: 2px;
      text-shadow: -2px 0 #7EE7F2;
      animation: glitchA 2.8s infinite linear alternate-reverse;
      opacity: 0.8;
    }

    .glitch::after {
      left: -2px;
      text-shadow: 2px 0 #7EE7F2;
      animation: glitchB 2.2s infinite linear alternate-reverse;
      opacity: 0.7;
    }

    @keyframes glitchA {
      0%   { clip-path: inset(10% 0 70% 0); transform: translate(-2px, 1px); }
      25%  { clip-path: inset(40% 0 30% 0); transform: translate(2px, -1px); }
      50%  { clip-path: inset(70% 0 10% 0); transform: translate(-1px, 2px); }
      75%  { clip-path: inset(20% 0 50% 0); transform: translate(1px, -2px); }
      100% { clip-path: inset(55% 0 15% 0); transform: translate(-2px, 1px); }
    }

    @keyframes glitchB {
      0%   { clip-path: inset(60% 0 15% 0); transform: translate(2px, -1px); }
      25%  { clip-path: inset(15% 0 60% 0); transform: translate(-2px, 1px); }
      50%  { clip-path: inset(45% 0 25% 0); transform: translate(1px, 2px); }
      75%  { clip-path: inset(75% 0 5% 0);  transform: translate(-1px, -1px); }
      100% { clip-path: inset(25% 0 45% 0); transform: translate(2px, 1px); }
    }

    /* Mobile */
    @media (max-width: 768px) {
      .wrapper {
        flex-direction: column-reverse;
        text-align: center;
        gap: 30px;
        padding-top: 80px;
      }

      .text {
        max-width: 100%;
      }

      .code {
        font-size: clamp(6.5rem, 26vw, 10rem);
      }

      .return {
        top: 20px;
        left: 20px;
      }
    }
  </style>
</head>
<body>

  <a href="/" class="return">Return</a>

  <div class="wrapper">
    <div class="text">
      <blank></blank>
    </div>

    <div class="code">
      <span class="glitch">404</span>
    </div>
  </div>

</body>
</html>
