<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[WIP] Splash Book Cover</title>

    <link rel="icon" type="image/x-icon" href="https://serafae.neocities.org/favicon/favicon.ico">

    <style>
        * {
            cursor: url('https://serafae.neocities.org/assets/misc-buttons/cursors/chrome-pointer-main.webp') 34 34, auto !important;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://serafae.neocities.org/images/backgrounds/pink/cybersilgism_pink_bg01.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            overflow: hidden;
        }

        /* The link that wraps the book */
        .book-link {
            display: block;
            position: relative;
            width: 807px;
            max-width: 90vw;          /* keeps it from overflowing on smaller screens */
            transition: transform 0.45s ease, filter 0.45s ease;
        }

        .book-link img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 4px;
            /* soft resting glow */
            box-shadow:
                0 0 25px rgba(255, 105, 180, 0.35),
                0 12px 40px rgba(0, 0, 0, 0.45);
            transition: box-shadow 0.45s ease, filter 0.45s ease;
        }

        /* ===== HOVER ILLUMINATION ===== */
        .book-link:hover {
            transform: scale(1.04);
        }

        .book-link:hover img {
            filter: brightness(1.18) saturate(1.1);
            box-shadow:
                0 0 15px rgba(255, 180, 220, 0.9),
                0 0 45px rgba(255, 105, 180, 0.7),
                0 0 90px rgba(255, 60, 150, 0.45),
                0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* Optional subtle inner light overlay (can be removed if you prefer pure filter) */
        .book-link::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 4px;
            background: radial-gradient(
                ellipse at center,
                rgba(255, 220, 240, 0.25) 0%,
                transparent 70%
            );
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        .book-link:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>

    <a href="https://serafae.neocities.org/" class="book-link" title="Enter the site">
        <!-- Replace this src with your 807×1103 book cover -->
        <img src="YOUR-BOOK-COVER-URL-HERE.png" 
             width="807" 
             height="1103" 
             alt="Book Cover">
    </a>

</body>
</html>
